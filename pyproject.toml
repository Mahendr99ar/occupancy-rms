[project]
name = "occupancy-rms"
version = "0.1.0"
description = "Hotel rate intelligence: rate shopping, feed monitoring, pickup forecasts and rate recommendations."
requires-python = ">=3.11"
dependencies = [
    "scrapy>=2.13",
    "flask>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42",
    "pymongo>=4.6",
    "redis>=5.0",
    "requests>=2.31",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pillow>=10.0",
    "torch>=2.2",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mongomock>=4.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["occupancy*"]

[tool.setuptools.package-data]
"occupancy.ota" = ["fonts/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # the formatter owns line length; long string literals stay whole

[tool.pytest.ini_options]
testpaths = ["tests"]
